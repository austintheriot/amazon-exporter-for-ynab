version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # typescript-eslint supports typescript >=4.8.4 <6.1.0; TS 7 fails lint.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # CI and release run Node 22; newer @types/node would allow APIs Node 22 lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
